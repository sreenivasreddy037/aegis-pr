[project]
name = "aegispr"
version = "0.1.0"
description = "AegisPR: Autonomous multi-agent code review with AST impact graphs and execution-verified regression findings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.4",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.3",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "python-dotenv>=1.0",
    # Runtime dependency: the sandbox executes synthesized regression tests with pytest.
    "pytest>=8.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "deepeval>=1.0",
    "ruff>=0.6",
]

[project.scripts]
aegispr = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures/sample_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "E501"]  # long lines are handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-ra"
markers = ["llm: tests that require a live LLM (skipped when offline)"]
